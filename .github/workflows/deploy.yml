# Baut aus den Notebooks in content/ eine JupyterLite-Seite und veröffentlicht sie auf GitHub Pages.
name: JupyterLite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JupyterLite installieren
        run: pip install -r requirements.txt
      # jupyterlite-xeus braucht micromamba, um die Kernel aus environment.yml (xeus-sqlite) zu installieren
      - name: micromamba installieren
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj bin/micromamba
          echo "$PWD/bin" >> $GITHUB_PATH
      - name: Seite bauen
        run: jupyter lite build --contents content --output-dir _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
